name: Build KKM99 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q KKM99-Android-App-Source.zip -d source

      - name: Build APK
        run: |
          gradle -p source/KKM99-Android-App assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KKM99-Android-APK
          path: source/KKM99-Android-App/app/build/outputs/apk/debug/app-debug.apk
